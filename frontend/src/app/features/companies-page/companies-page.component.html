<div class="container-fluid py-3">

  <!-- Feedback banner -->
  <div *ngIf="feedbackMessage" class="alert mb-3"
    [class.alert-success]="feedbackType === 'success'"
    [class.alert-danger]="feedbackType === 'error'">
    {{ feedbackMessage }}
  </div>

  <!-- Top action bar -->
  <div class="d-flex align-items-center gap-2 mb-3">
    <button class="btn btn-primary" (click)="openCreateCompanyModal()">+ Create Company</button>
    <input class="form-control w-auto" placeholder="Quick filter..." (input)="onQuickFilterChange($event)">
  </div>

  <!-- AG Grid -->
  <ag-grid-angular
    style="width: 100%; height: 500px;"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [getRowClass]="getRowClass"
    [animateRows]="true"
    (gridReady)="onGridReady($event)">
  </ag-grid-angular>

</div>

<app-company-modal
  [show]="showCompanyModal"
  [mode]="companyModalMode"
  [submitting]="companyModalSubmitting"
  [error]="companyModalError"
  [form]="companyForm"
  [offices]="offices"
  [duplicateOfficeName]="hasDuplicateOfficeName()"
  (closeModal)="closeCompanyModal()"
  (submitModal)="submitCompanyModal()"
  (addOffice)="addOfficeRow()"
  (removeOffice)="removeOfficeRow($event)">
</app-company-modal>

<app-office-modal
  [show]="showOfficeModal"
  [mode]="officeModalMode"
  [submitting]="officeModalSubmitting"
  [error]="officeModalError"
  [companyName]="officeModalCompanyName"
  [form]="officeForm"
  (closeModal)="closeOfficeModal()"
  (submitModal)="submitOfficeModal()">
</app-office-modal>

<app-confirm-modal
  [show]="showConfirmModal"
  [message]="confirmMessage"
  (confirm)="confirmYes()"
  (cancel)="confirmNo()">
</app-confirm-modal>
