<section>
  <h2>Shipments</h2>
  <p *ngIf="feedbackMessage" [style.color]="feedbackType === 'error' ? '#b00020' : '#0a7a2f'">{{ feedbackMessage }}</p>
  <form [formGroup]="shipmentForm" (ngSubmit)="createShipment()">
    <input formControlName="senderId" type="number" placeholder="Sender customer ID" />
    <input formControlName="receiverId" type="number" placeholder="Receiver customer ID" />
    <input formControlName="officeId" type="number" placeholder="Office ID" />
    <input formControlName="weight" type="number" step="0.1" placeholder="Weight" />
    <input formControlName="description" placeholder="Description" />
    <button type="submit">Create shipment</button>
  </form>
  <ul>
    <li *ngFor="let shipment of shipments$ | async">
      {{ shipment.id }} - {{ shipment.trackingNumber }} - {{ shipment.status }}
      <button type="button" (click)="markInTransit(shipment.id)">Mark in transit</button>
      <button type="button" (click)="markDelivered(shipment.id)">Mark delivered</button>
      <button type="button" (click)="cancel(shipment.id)">Cancel</button>
    </li>
  </ul>
</section>
