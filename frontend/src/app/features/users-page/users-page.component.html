<div class="container-fluid py-3 users-page">
  <div *ngIf="feedbackMessage" class="alert mb-3"
    [class.alert-success]="feedbackType === 'success'"
    [class.alert-danger]="feedbackType === 'error'">
    {{ feedbackMessage }}
  </div>

  <div class="btn-group mb-3 users-page__tabs" role="group" aria-label="Users tabs">
    <button
      type="button"
      class="btn"
      [class.btn-primary]="activeTab === 'employees'"
      [class.btn-outline-primary]="activeTab !== 'employees'"
      (click)="setTab('employees')">
      Employees
    </button>
    <button
      type="button"
      class="btn"
      [class.btn-primary]="activeTab === 'customers'"
      [class.btn-outline-primary]="activeTab !== 'customers'"
      (click)="setTab('customers')">
      Customers
    </button>
  </div>

  <section *ngIf="activeTab === 'employees'">
    <div class="d-flex align-items-center gap-2 mb-3 flex-wrap users-page__toolbar" *ngIf="isAdmin">
      <button class="btn btn-primary" (click)="openCreateEmployeeModal()">+ Create Employee</button>
      <button class="btn btn-outline-primary" (click)="openCreateAdminModal()">+ Create Admin</button>
      <input class="form-control users-page__filter" placeholder="Quick filter..." (input)="onEmployeesQuickFilterChange($event)">
    </div>

    <div class="users-page__grid-shell">
      <ag-grid-angular
        class="users-page__grid"
        style="width: 100%; height: 520px;"
        [rowData]="employeesRowData"
        [columnDefs]="employeeColumnDefs"
        [animateRows]="true"
        (gridReady)="onEmployeesGridReady($event)">
      </ag-grid-angular>
    </div>
  </section>

  <section *ngIf="activeTab === 'customers'">
    <div class="d-flex align-items-center gap-2 mb-3 flex-wrap users-page__toolbar">
      <button class="btn btn-primary" (click)="openCreateCustomerModal()">+ Create Customer</button>
      <input class="form-control users-page__filter" placeholder="Quick filter..." (input)="onCustomersQuickFilterChange($event)">
    </div>

    <div class="users-page__grid-shell">
      <ag-grid-angular
        class="users-page__grid"
        style="width: 100%; height: 520px;"
        [rowData]="customersRowData"
        [columnDefs]="customersColumnDefs"
        [animateRows]="true"
        (gridReady)="onCustomersGridReady($event)">
      </ag-grid-angular>
    </div>
  </section>
</div>

<app-employee-modal
  [show]="showEmployeeModal"
  [mode]="employeeModalMode"
  [submitting]="employeeModalSubmitting"
  [error]="employeeModalError"
  [form]="employeeForm"
  [companies]="companies"
  [officesByCompany]="officesByCompany"
  [selectedCompanyHasOffices]="selectedCompanyHasOffices"
  (closeModal)="closeEmployeeModal()"
  (submitModal)="submitEmployeeModal()">
</app-employee-modal>

<app-admin-modal
  [show]="showAdminModal"
  [submitting]="adminModalSubmitting"
  [error]="adminModalError"
  [form]="adminForm"
  (closeModal)="closeAdminModal()"
  (submitModal)="submitAdminModal()">
</app-admin-modal>

<app-customer-modal
  [show]="showCustomerModal"
  [mode]="customerModalMode"
  [submitting]="customerModalSubmitting"
  [error]="customerModalError"
  [form]="customerForm"
  [companies]="companies"
  (closeModal)="closeCustomerModal()"
  (submitModal)="submitCustomerModal()">
</app-customer-modal>
