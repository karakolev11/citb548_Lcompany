<div class="modal-backdrop-custom" *ngIf="show" (click)="close()"></div>
<div class="modal-custom" *ngIf="show">
  <div class="modal-dialog modal-lg" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ mode === 'create' ? 'Create Customer' : 'Edit Customer' }}</h5>
        <button type="button" class="btn-close" (click)="close()" [disabled]="submitting"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

        <form [formGroup]="form" class="row g-2">
          <div class="col-md-6" *ngIf="mode === 'create'">
            <label class="form-label">Username</label>
            <input class="form-control" formControlName="username" [disabled]="submitting">
          </div>
          <div class="col-md-6" *ngIf="mode === 'create'">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" formControlName="email" [disabled]="submitting">
          </div>
          <div class="col-md-6" *ngIf="mode === 'create'">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" formControlName="password" [disabled]="submitting">
          </div>
          <div class="col-md-6" *ngIf="mode !== 'create'"></div>
          <div class="col-md-6">
            <label class="form-label">First Name</label>
            <input class="form-control" formControlName="firstName" [disabled]="submitting">
          </div>
          <div class="col-md-6">
            <label class="form-label">Last Name</label>
            <input class="form-control" formControlName="lastName" [disabled]="submitting">
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input class="form-control" formControlName="phone" [disabled]="submitting">
          </div>
          <div class="col-md-6">
            <label class="form-label">Company</label>
            <select class="form-select" formControlName="companyId" [disabled]="submitting">
              <option [ngValue]="null">No company</option>
              <option *ngFor="let company of companies" [ngValue]="company.id">{{ company.name }}</option>
            </select>
          </div>
          <div class="col-md-12">
            <label class="form-label">Address</label>
            <input class="form-control" formControlName="address" [disabled]="submitting">
          </div>
          <div class="col-md-4">
            <label class="form-label">City</label>
            <input class="form-control" formControlName="city" [disabled]="submitting">
          </div>
          <div class="col-md-4">
            <label class="form-label">State</label>
            <input class="form-control" formControlName="state" [disabled]="submitting">
          </div>
          <div class="col-md-4">
            <label class="form-label">Zip Code</label>
            <input class="form-control" formControlName="zipCode" [disabled]="submitting">
          </div>
          <div class="col-md-6">
            <label class="form-label">Country</label>
            <input class="form-control" formControlName="country" [disabled]="submitting">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="close()" [disabled]="submitting">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="submitting">
          {{ submitting ? 'Saving...' : (mode === 'create' ? 'Create Customer' : 'Save Changes') }}
        </button>
      </div>
    </div>
  </div>
</div>
