<header id="topnav" class="app-nav" (window:scroll)="windowScroll()" [class]="navClass">
  <div class="app-nav__inner container">
    <a class="app-nav__brand" routerLink="/app/shipments" (click)="closeMenu()">
      <img src="assets/images/logo-dark.png" class="app-nav__logo" height="24" alt="LCompany logo">
      <span class="app-nav__title">LCompany</span>
    </a>

    <button
      type="button"
      class="app-nav__toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation">
      <i-feather [name]="menuOpen ? 'x' : 'menu'" class="fea icon-sm"></i-feather>
    </button>

    <nav class="app-nav__menu" [class.app-nav__menu--open]="menuOpen">
      <a routerLink="/app/shipments" class="app-nav__link" (click)="closeMenu()">Shipments</a>
      <a *ngIf="isAdmin()" routerLink="/app/companies" class="app-nav__link" (click)="closeMenu()">Companies</a>
      <a *ngIf="canAccessUsers()" routerLink="/app/users" class="app-nav__link" (click)="closeMenu()">Users</a>
      <a *ngIf="canAccessBackoffice()" routerLink="/app/reports" class="app-nav__link" (click)="closeMenu()">Reports</a>
      <button type="button" class="app-nav__link app-nav__link--button" (click)="logout()">Logout</button>
    </nav>
  </div>
</header>
